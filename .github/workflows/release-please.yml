name: Release Please

on:
    workflow_run:
        workflows: [Quality]
        types: [completed]
        branches: [main]

permissions: {}

jobs:
    release:
        permissions:
            contents: write
            issues: write
            pull-requests: write
            actions: write
        uses: RocketsAreNostalgic/.github/.github/workflows/release-profile-b.yml@aa88eb65d67f26ef7c73a87ba8b43f7eb7f2c0c2
        with:
            expected-workflow-path: .github/workflows/quality.yml
            release-pr-head: release-please--branches--main--components--ran-enhanced-cover
            artifact-prefix: ran-enhanced-cover-release
