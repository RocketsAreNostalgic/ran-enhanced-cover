name: WordPress.org Deployment

on:
    workflow_run:
        workflows: [Release Please]
        types: [completed]
        branches: [main]

permissions: {}

jobs:
    contract:
        name: Resolve exact immutable GitHub release
        if: >-
            ${{
                github.event.workflow_run.event == 'workflow_run'
                && github.event.workflow_run.conclusion == 'success'
                && github.event.workflow_run.head_branch == 'main'
                && github.event.workflow_run.head_repository.full_name == github.repository
                && github.event.workflow_run.head_repository.id == github.repository_id
                && github.event.workflow_run.path == '.github/workflows/release-please.yml'
            }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: read
        outputs:
            deploy-required: ${{ steps.release.outputs.deploy-required }}
            enabled: ${{ steps.contract.outputs.enabled }}
            tag: ${{ steps.release.outputs.tag }}
        steps:
            - name: Check out exact admitted main revision
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Resolve exact immutable release
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_ADMITTED_SHA: ${{ github.event.workflow_run.head_sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$RAN_ADMITTED_SHA"
                  release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
                  matches="$(jq -cer \
                      --arg sha "$RAN_ADMITTED_SHA" \
                      'add | [.[] | select(
                          .target_commitish == $sha
                          and .draft == false
                          and .immutable == true
                      )]' \
                      <<< "$release_pages")"
                  count="$(jq -er 'length' <<< "$matches")"
                  if [[ "$count" == 0 ]]; then
                      echo 'deploy-required=false' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  test "$count" == 1
                  tag="$(jq -er '.[0].tag_name' <<< "$matches")"
                  [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
                  tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
                  jq -e --arg sha "$RAN_ADMITTED_SHA" \
                      '.object.type == "commit" and .object.sha == $sha' \
                      <<< "$tag_ref" >/dev/null
                  printf 'deploy-required=true\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

            - name: Read committed deployment contract
              id: contract
              if: ${{ steps.release.outputs.deploy-required == 'true' }}
              shell: bash
              run: |
                  set -euo pipefail
                  jq -e '.enabled | type == "boolean"' wordpress-org/deployment.json >/dev/null
                  enabled="$(jq -r '.enabled' wordpress-org/deployment.json)"
                  printf 'enabled=%s\n' "$enabled" >> "$GITHUB_OUTPUT"

    deploy:
        name: Deploy exact GitHub release to WordPress.org
        needs: contract
        if: >-
            ${{
                needs.contract.outputs.deploy-required == 'true'
                && needs.contract.outputs.enabled == 'true'
            }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: read
        environment: wordpress-org
        env:
            ADMITTED_SHA: ${{ github.event.workflow_run.head_sha }}
            TAG_NAME: ${{ needs.contract.outputs.tag }}
            WORDPRESS_ORG_USERNAME: ${{ secrets.WORDPRESS_ORG_USERNAME }}
            WORDPRESS_ORG_PASSWORD: ${{ secrets.WORDPRESS_ORG_PASSWORD }}
        steps:
            - name: Check out exact published tag
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ env.TAG_NAME }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  extensions: zip
                  coverage: none

            - name: Download and verify exact immutable GitHub release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$ADMITTED_SHA"
                  version="${TAG_NAME#v}"
                  archive="ran-enhanced-cover-${version}.zip"
                  checksum="${archive}.sha256"
                  mkdir -p dist
                  gh release download "$TAG_NAME" --pattern "$archive" --dir dist --repo "$GITHUB_REPOSITORY"
                  gh release download "$TAG_NAME" --pattern "$checksum" --dir dist --repo "$GITHUB_REPOSITORY"
                  test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
                  jq -e \
                      --arg commit "$ADMITTED_SHA" \
                      --arg tag "$TAG_NAME" \
                      '.tag_name == $tag
                          and .target_commitish == $commit
                          and .draft == false
                          and .immutable == true' \
                      <<< "$release_json" >/dev/null
                  expected="$(printf '%s\n' "$archive" "$checksum" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
                  test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected"

                  for name in "$archive" "$checksum"; do
                      local_digest="sha256:$(sha256sum "dist/${name}" | awk '{ print $1 }')"
                      remote_digest="$(jq -er --arg name "$name" \
                          '[.assets[] | select(.name == $name)] | if length == 1 then .[0].digest else error("Expected one exact release asset.") end' \
                          <<< "$release_json")"
                      test "$local_digest" = "$remote_digest"
                  done

            - name: Deploy verified immutable release to protected SVN
              shell: bash
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  bash scripts/deploy-wordpress-org.sh \
                      "dist/ran-enhanced-cover-${version}.zip" \
                      "dist/ran-enhanced-cover-${version}.zip.sha256" \
                      "$TAG_NAME"
